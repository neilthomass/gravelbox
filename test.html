<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #111318;
        color: #f5f7ff;
      }

      main {
        width: min(760px, calc(100% - 32px));
        text-align: center;
      }

      video {
        display: block;
        width: 100%;
        margin: 20px 0;
        border: 1px solid #383d4c;
        border-radius: 14px;
        aspect-ratio: 16 / 9;
        background: #000;
        object-fit: contain;
      }

      .audio-level {
        display: grid;
        grid-template-columns: auto 1fr 3.5rem;
        align-items: center;
        gap: 12px;
        margin: 0 0 20px;
        text-align: left;
      }

      meter { width: 100%; height: 20px; }
      #volume-value { color: #b9bfce; text-align: right; }

      button {
        padding: 11px 18px;
        border: 0;
        border-radius: 9px;
        background: #7668ff;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      button:disabled { cursor: wait; opacity: 0.65; }
      #status { min-height: 24px; color: #b9bfce; }
      .error { color: #ff939e !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Camera Test</h1>
      <p>This page requests one video input and displays the returned stream.</p>
      <video id="camera" autoplay muted playsinline></video>
      <div class="audio-level">
        <label for="volume">Audio level (muted)</label>
        <meter id="volume" min="0" max="100" value="0"></meter>
        <span id="volume-value">0%</span>
      </div>
      <button id="start" type="button">Start camera</button>
      <p id="status">Camera has not been requested yet.</p>
    </main>

    <script>
      const video = document.querySelector("#camera");
      const button = document.querySelector("#start");
      const status = document.querySelector("#status");
      const volume = document.querySelector("#volume");
      const volumeValue = document.querySelector("#volume-value");
      let activeStream = null;
      let audioContext = null;
      let meterAnimation = 0;

      function stopCurrentStream() {
        cancelAnimationFrame(meterAnimation);
        meterAnimation = 0;
        volume.value = 0;
        volumeValue.textContent = "0%";
        if (audioContext) {
          audioContext.close().catch(() => {});
          audioContext = null;
        }
        if (activeStream) {
          activeStream.getTracks().forEach((track) => track.stop());
          activeStream = null;
        }
      }

      function startVolumeMeter(stream) {
        if (!stream.getAudioTracks().length) {
          return;
        }
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const samples = new Uint8Array(analyser.fftSize);

        function updateMeter() {
          analyser.getByteTimeDomainData(samples);
          let sumOfSquares = 0;
          for (const sample of samples) {
            const centered = (sample - 128) / 128;
            sumOfSquares += centered * centered;
          }
          const rms = Math.sqrt(sumOfSquares / samples.length);
          const percent = Math.min(100, Math.round(rms * 200));
          volume.value = percent;
          volumeValue.textContent = `${percent}%`;
          meterAnimation = requestAnimationFrame(updateMeter);
        }
        updateMeter();
      }

      button.addEventListener("click", async () => {
        button.disabled = true;
        status.classList.remove("error");
        status.textContent = "Requesting camera…";

        stopCurrentStream();

        try {
          activeStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
          });
          video.srcObject = activeStream;
          await video.play();
          startVolumeMeter(activeStream);
          const videoTrack = activeStream.getVideoTracks()[0];
          const audioTrack = activeStream.getAudioTracks()[0];
          status.textContent = `Receiving: ${videoTrack.label || "video track"} + muted ${audioTrack.label || "audio track"}`;
        } catch (error) {
          status.classList.add("error");
          status.textContent = `${error.name}: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });

      window.addEventListener("pagehide", () => {
        stopCurrentStream();
      });
    </script>
  </body>
</html>
