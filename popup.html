<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravelbox</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="header-line">
          <h1>Gravelbox</h1>
        </div>
        <p>Control each feature separately.</p>
      </header>

      <label class="feature">
        <span><strong>Loop camera</strong><small>Use the active library video</small></span>
        <span class="switch">
          <input id="cameraEnabled" type="checkbox" />
          <i aria-hidden="true"></i>
        </span>
      </label>

      <label class="feature feature-select">
        <span><strong>Loop video</strong><small>Recording library</small></span>
        <select id="recordingSelector">
          <option value="">Choose a recording…</option>
          <option value="__manage__">Manage recordings…</option>
        </select>
      </label>

      <label class="feature feature-select">
        <span><strong>Location</strong><small>Override site coordinates</small></span>
        <select id="locationSelector">
          <option value="">Use real location</option>
          <option value="__new__">New location…</option>
        </select>
      </label>

      <form id="locationForm" class="coordinate-form" hidden>
        <input id="locationName" class="location-name" type="text" maxlength="40" placeholder="Location name" aria-label="Location name" required />
        <input id="latitude" type="number" min="-90" max="90" step="any" inputmode="decimal" placeholder="Latitude" aria-label="Latitude" required />
        <input id="longitude" type="number" min="-180" max="180" step="any" inputmode="decimal" placeholder="Longitude" aria-label="Longitude" required />
        <button type="submit">Save</button>
      </form>

      <label class="feature">
        <span><strong>Virtual microphone</strong><small>Use the active video's audio</small></span>
        <span class="switch">
          <input id="audioMuted" type="checkbox" checked />
          <i aria-hidden="true"></i>
        </span>
      </label>

      <label class="feature">
        <span><strong>Block function keys</strong><small>Hide F1–F24 from websites</small></span>
        <span class="switch">
          <input id="functionKeysBlocked" type="checkbox" checked />
          <i aria-hidden="true"></i>
        </span>
      </label>

      <div class="feature">
        <span>
          <strong>Gradescope calendar</strong>
          <small>Scrape assignments and sync them</small>
          <small id="gradescopeSyncStatus" class="sync-status" role="status" aria-live="polite"></small>
        </span>
        <button id="gradescopeSync" class="sync-button" type="button">Sync</button>
      </div>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
